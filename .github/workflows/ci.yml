name: ci

# Las reglas de este archivo las prueban scripts/guardas/workflows.test.ts y workflows-flujo.test.ts. Los puertos son los heredados
# de este repo (546xx, sin bloque: supabase/config.toml) y las funciones edge, las de e2e/soporte/guardia.ts. Por niveles (docs/FLUJO.md,
# .claude/rules/e2e.md): un PR
# corre el Nivel 1 y los e2e dirigidos a lo tocado (el completo de escritorio si toca un disparador del Nivel 2:
# scripts/e2e-dirigidos.mjs); cada noche, el completo con los dos proyectos sobre main si hubo commits (y el aviso de la noche abre el issue
# `noche-roja`, que a la segunda noche seguida entra a la cola: scripts/flujo/noche.mjs); antes de desplegar, el completo con los
# dos proyectos a mano (workflow_dispatch, `proyectos: ambos`). El job `listo` resume a todos: es el único check que main exige, y con
# él en verde el PR entra a la cola de integración (auto-merge), que corre esto otra vez sobre el commit combinado con main y los PR de
# delante (`merge_group`: lo mismo que pidió el PR, con `HEAD^1` como base) y lo integra. En la plantilla del kit (.kit/plantilla, la salida «plantilla» de `cambios`) los
# jobs de proyecto se saltan y corre en su lugar «kit · proyecto de ejemplo».
on:
  push:
    branches: [main]
  pull_request:
  # La cola de integración (docs/FLUJO.md › «GitHub»): el grupo es main, los PR de delante y este, cada uno en un commit (squash).
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '0 7 * * *' # 03:00 en La Paz
  workflow_dispatch:
    inputs:
      proyectos:
        description: 'Proyectos del e2e: escritorio (como el Nivel 2) o ambos (el Nivel 3, antes de desplegar)'
        type: choice
        options: [escritorio, ambos]
        default: escritorio
      e2e:
        description: 'Compilar la app y correr el e2e en sus bloques'
        type: boolean
        default: true
      carreras:
        description: 'Correr las carreras con dos conexiones (docs/PENDIENTES.md, 9-6): cada corrida cuenta para las 5 seguidas en verde'
        type: boolean
        default: false

permissions:
  contents: read

# Un push nuevo a la misma rama (o al mismo PR) cancela la corrida anterior. Un dispatch (un e2e largo, unas carreras) tiene su propio
# grupo, con run_id, y nunca se cancela: ni un push lo corta ni otro dispatch lo deja en espera. La corrida de cada noche, igual: en el
# grupo de los push a main, la integración siguiente la cancelaba (a los 12 min), y de ella depende saber si una prueba cae dos noches
# seguidas. Un grupo de la cola de integración tiene su propia ref (`gh-readonly-queue/main/pr-<n>-<sha>`): su grupo es único.
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && format('ci-manual-{0}-{1}', github.ref, github.run_id) || format('ci-{0}', github.head_ref || github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.event_name != 'schedule' }}

# Acciones de terceros admitidas, una por línea con su motivo (`# accion-de-terceros: <dueño/repo> — <motivo>`).
# Hoy ninguna: sólo acciones de GitHub (`actions/*`), fijadas por SHA, y las locales de `./.github/acciones/`.

env:
  # El stack local de Supabase usa los puertos 546xx (supabase/config.toml).
  SUPABASE_API_LOCAL: http://127.0.0.1:54621
  SUPABASE_DB_LOCAL: postgresql://postgres:postgres@127.0.0.1:54622/postgres
  # La clave publicable fija de la pila local de la CLI (pública por diseño; no es la de un proyecto). El build del e2e la
  # inlinea y cada bloque comprueba que su `supabase status` da la misma: si la CLI la cambia, el bloque falla diciéndolo.
  CLAVE_PUBLICA_LOCAL: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
  # config.toml lee las credenciales de Google con env(): en CI van de relleno, nadie ingresa con Google.
  SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: relleno-ci
  SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: relleno-ci
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # Siempre: algunas guardas de `pnpm test` leen docs/, así que un cambio sólo de documentación también lo corre.
  nivel-1:
    name: Nivel 1 · lint, tipos, test:kit y mapa
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # En la cola de integración, la base del PR es el padre del commit del grupo (HEAD^1).
          fetch-depth: 2
      - uses: ./.github/acciones/preparar
      # El PR se integra con squash: su título es el mensaje del commit que queda en main (docs/FLUJO.md).
      - name: el título del PR es un commit convencional
        if: github.event_name == 'pull_request'
        env:
          TITULO: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITULO" | pnpm exec commitlint
      # Una migración nueva va después de la última de main: un reset aplica por el orden del nombre (.claude/rules/migraciones.md).
      # Y una versión publicada de un contrato (o una copia fijada) no cambia nunca: contra el main recién bajado
      # (.claude/rules/contratos.md). En la cola de integración, contra HEAD^1: main y los PR de delante en el grupo, así que dos PR de
      # la misma cola con migraciones cruzadas también caen.
      - name: las migraciones del PR van después de las de main y sus contratos publicados no cambian
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          EVENTO: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENTO" = merge_group ]; then
            base=HEAD^1
          else
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            base=FETCH_HEAD
          fi
          MIGRACIONES_BASE=$base pnpm exec vitest run scripts/guardas/orden-de-migraciones.test.ts
          CONTRATOS_BASE=$base pnpm exec vitest run scripts/guardas/contratos-publicados.test.ts
      - run: pnpm lint
      - run: pnpm typecheck # corre `next typegen` antes de tsc
      # Las pruebas de `node --test` (`pnpm test` las corre después de vitest; vitest va en «pruebas», en 3 partes).
      - run: pnpm test:kit
      # Todo guion de bash del repo con .shellcheckrc. shellcheck del apt del runner (sin acciones de terceros); la imagen suele traerlo.
      - name: shellcheck
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
          shellcheck --version | sed -n 2p
          shopt -s globstar
          shellcheck scripts/**/*.sh .claude/hooks/*.sh
      - run: bash scripts/mapa.sh --check

  # vitest en 3 partes (`--shard`), cada una en su runner: en un solo job eran 14 de los 15 a 18 min del Nivel 1 (962 archivos), el job
  # más largo de un PR con e2e dirigidos. Va con `pnpm exec vitest run` y no con `pnpm test --shard`, que le pasaría la bandera también
  # a `test:kit`.
  pruebas:
    name: Nivel 1 · tests, parte ${{ matrix.parte }} de 3
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/acciones/preparar
      - run: pnpm exec vitest run --shard=${{ matrix.parte }}/3

  # Decide si corren los jobs pesados y los de contratos (scripts/ci-cambios.sh, probado en scripts/ci-cambios.test.ts) y qué e2e corre
  # un PR: el completo en 8 bloques, los dirigidos en 1 a 4, o ninguno (scripts/e2e-dirigidos.mjs). Fuera de un PR, el completo. Y si
  # este repo es la plantilla del kit.
  cambios:
    name: Cambios · ¿base y e2e?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      plantilla: ${{ steps.marca.outputs.plantilla }}
      pesado: ${{ steps.filtro.outputs.pesado }}
      e2e: ${{ steps.filtro.outputs.e2e }}
      contrato: ${{ steps.filtro.outputs.contrato }}
      contrato_uso: ${{ steps.filtro.outputs.contrato_uso }}
      e2e_modo: ${{ steps.e2e.outputs.e2e_modo }}
      e2e_specs: ${{ steps.e2e.outputs.e2e_specs }}
      e2e_bloques: ${{ steps.e2e.outputs.e2e_bloques }}
      e2e_de: ${{ steps.e2e.outputs.e2e_de }}
      e2e_proyectos: ${{ steps.e2e.outputs.e2e_proyectos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # El diff necesita `before` (push) y la base del PR: con un clon superficial no están y todo cae a «pesado».
          fetch-depth: 0
      # ¿Es este repo la plantilla del kit? (.kit/plantilla no viaja a un proyecto generado). hashFiles no existe en el `if` de un job.
      - id: marca
        run: echo "plantilla=$([ -f .kit/plantilla ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - id: filtro
        env:
          EVENTO: ${{ github.event_name }}
          ANTES: ${{ github.event.before }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci-cambios.sh >> "$GITHUB_OUTPUT"
      - id: e2e
        env:
          EVENTO: ${{ github.event_name }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENTO" = pull_request ] || [ "$EVENTO" = merge_group ]; then
            # En la cola de integración, lo que trae el PR es HEAD^1...HEAD (el grupo integra con squash): lo mismo que pidió el PR.
            desde=$BASE_PR
            if [ "$EVENTO" = merge_group ] && ! desde=$(git rev-parse -q --verify 'HEAD^1'); then
              echo "::error::el commit del grupo no tiene padre: ¿la cola integra con squash? (docs/FLUJO.md › «GitHub»)"
              git log --oneline -3
              exit 1
            fi
            node scripts/e2e-dirigidos.mjs --rango "$desde...HEAD" --github >> "$GITHUB_OUTPUT"
          elif [ "$EVENTO" = schedule ]; then
            # Cada noche, los dos proyectos: un PR corre en `movil` sólo los specs de lo que toca, y lo que rompe en el celular un spec
            # ajeno llegaba a main sin que nadie lo viera. En 8 bloques, para tardar lo que tardaban 4 con sólo escritorio.
            printf '%s\n' e2e_modo=completo e2e_specs= 'e2e_bloques=[1,2,3,4,5,6,7,8]' e2e_de=8 e2e_proyectos=ambos >> "$GITHUB_OUTPUT"
          else
            # A mano, fuera de un PR: el completo de escritorio, en 8 bloques como el de un PR.
            printf '%s\n' e2e_modo=completo e2e_specs= 'e2e_bloques=[1,2,3,4,5,6,7,8]' e2e_de=8 e2e_proyectos=escritorio >> "$GITHUB_OUTPUT"
          fi

  base:
    name: Base · reset, tipos, probar, lint y advisors
    needs: cambios
    if: needs.cambios.outputs.pesado == 'true' && needs.cambios.outputs.plantilla != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/acciones/preparar
      # La CLI es la devDependency (`pnpm exec supabase`): la misma versión que en local, fijada por pnpm-lock.yaml.
      - uses: ./.github/acciones/pila
        with:
          sin: studio,imgproxy,edge-runtime,logflare,vector
      - run: pnpm db:reset
      - name: db:types sin diff
        run: |
          pnpm db:types
          git diff --exit-code -- src/shared/types/database.types.ts
      - run: pnpm db:probar
      # 4-40: anon no toca public, y lo nuevo nace sin privilegios de más (los mismos asserts que db:probar, contra la base real).
      - name: privilegios de anon y authenticated en public
        run: psql "$SUPABASE_DB_LOCAL" -v ON_ERROR_STOP=1 -f supabase/tests/privilegios-de-anon.sql
      - run: pnpm db:lint
      # 9.13-2: splinter con los schemas de [api] (también web) y la misma regla de db:probar (supabase/tests/advisors.sql), su sentido
      # inverso, db:lint contra su lista y el inventario del repo contra la base (scripts/despliegue/revisar-base.mjs, sólo base local).
      # Lo corre también la sesión antes de publicar (`pnpm db:revisar`, scripts/db/revisar.sh): el mismo paso, no uno parecido.
      - name: la base contra el repo (splinter con los schemas de [api], db:lint y el inventario)
        run: pnpm db:revisar

  # docs/PENDIENTES.md, 9-6: dos o tres conexiones reales, sólo a mano (`carreras: true`) hasta 5 corridas seguidas en verde; entonces
  # pasan a `base`. Sin reintentos: `scripts/carreras.mjs` falla si una carrera no llegó a probarse.
  carreras:
    name: Carreras · db:carreras (a mano, 9-6)
    if: github.event_name == 'workflow_dispatch' && inputs.carreras
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/acciones/preparar
      - uses: ./.github/acciones/pila
        with:
          sin: studio,imgproxy,edge-runtime,logflare,vector
      - run: pnpm db:reset
      - run: pnpm db:carreras

  # El proveedor de contratos entre repos (.claude/rules/contratos.md): su base local cumple cada versión de `vigentes` y la de `provee`.
  # Corre si el cambio toca supabase/, contratos/, scripts/contratos/ o el manifiesto, y levanta la pila sólo si el repo provee algo:
  # lo decide el paso `rol`, porque `cambios` no instala dependencias. Nunca mira la base de otro repo.
  contrato:
    name: Contrato · la base cumple sus versiones
    needs: cambios
    if: needs.cambios.outputs.contrato == 'true' && needs.cambios.outputs.plantilla != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/acciones/preparar
      - id: rol
        run: pnpm exec tsx scripts/contratos/contrato.ts rol >> "$GITHUB_OUTPUT"
      - if: steps.rol.outputs.provee == 'true'
        uses: ./.github/acciones/pila
        with:
          sin: studio,imgproxy,edge-runtime,logflare,vector
      - if: steps.rol.outputs.provee == 'true'
        run: pnpm db:reset
      - if: steps.rol.outputs.provee == 'true'
        run: pnpm contrato:probar

  # El consumidor: su `infra/` sólo llama lo que está en las copias fijadas (`.proyecto/contratos/`) y los tipos generados de esas copias
  # están al día (como `db:types sin diff`; también atrapa uno sin rastrear). Sin base ni pila: sólo archivos.
  contrato-uso:
    name: Contrato · el consumidor usa sólo lo fijado
    needs: cambios
    if: needs.cambios.outputs.contrato_uso == 'true' && needs.cambios.outputs.plantilla != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/acciones/preparar
      - run: pnpm contrato:usar
      - name: tipos de los contratos sin diff
        run: |
          pnpm contrato:tipos
          git status --porcelain -- src/shared/types/contratos/
          test -z "$(git status --porcelain -- src/shared/types/contratos/)"

  # La app se compila una vez y los bloques bajan la misma (factura menos y corre en paralelo con el Nivel 1). Un PR sin e2e que correr
  # (`e2e_modo: ninguno`) no compila. Con workflow_dispatch, `e2e: false` lo apaga (para correr sólo las carreras).
  e2e-build:
    name: e2e · compilar la app
    needs: cambios
    if: needs.cambios.outputs.e2e == 'true' && needs.cambios.outputs.e2e_modo != 'ninguno' && (github.event_name != 'workflow_dispatch' || inputs.e2e) && needs.cambios.outputs.plantilla != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/acciones/preparar
      - name: next build en .next-e2e
        env:
          NEXT_DIST_DIR: .next-e2e
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_API_LOCAL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.CLAVE_PUBLICA_LOCAL }}
        run: pnpm exec next build
      - name: empaquetar sin la caché de compilación
        run: tar --exclude=.next-e2e/cache -czf "$RUNNER_TEMP/next-e2e.tgz" .next-e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: next-e2e
          path: ${{ runner.temp }}/next-e2e.tgz
          retention-days: 1
          if-no-files-found: error

  # Cada bloque tiene su runner y su pila de Supabase: una base por bloque. Un reintento en CI (`playwright.config.ts`): la prueba que
  # pasa al reintentar queda anotada en el PR (e2e/soporte/reporter-de-inestables.ts); la causa de un fallo va a los artefactos y a
  # e2e-fallos/. Las carreras (`db:carreras`) van en su job, a mano (docs/PENDIENTES.md, 9-6).
  e2e:
    name: e2e · bloque ${{ matrix.bloque }} de ${{ needs.cambios.outputs.e2e_de }}
    # Sin esperar al Nivel 1: compilar tarda menos y cada PR perdía esos minutos con los runners libres.
    needs: [cambios, e2e-build]
    if: needs.cambios.outputs.e2e == 'true' && needs.cambios.outputs.e2e_modo != 'ninguno' && (github.event_name != 'workflow_dispatch' || inputs.e2e) && needs.cambios.outputs.plantilla != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 8 bloques para el completo; los dirigidos de un PR, uno cada 20 specs y hasta 4 (scripts/e2e-dirigidos.mjs).
        bloque: ${{ fromJSON(needs.cambios.outputs.e2e_bloques || '[1,2,3,4,5,6,7,8]') }}
    env:
      # Escritorio por defecto; `proyectos: ambos` (workflow_dispatch) corre los dos, el Nivel 3. Los dirigidos de un PR que toca
      # interfaz, también los dos (el Nivel 1).
      PROYECTOS: ${{ inputs.proyectos || needs.cambios.outputs.e2e_proyectos || 'escritorio' }}
      # Vacío: el completo. Si no, los specs dirigidos, separados por espacios.
      ESPECS: ${{ needs.cambios.outputs.e2e_specs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/acciones/preparar
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # `--with-deps` llama a apt, y si el espejo de Ubuntu no resuelve (exit 100) o se cuelga, caían todos los bloques de todos los PR.
      # La imagen ubuntu-24.04 ya trae las bibliotecas; sin apt sólo faltan fuentes extra. Por eso: tope corto y, si falla, el navegador
      # solo.
      - name: chromium y lo que pide del sistema
        run: |
          timeout --kill-after=10 240 pnpm exec playwright install --with-deps chromium \
            || { echo "::warning::apt no respondió: chromium sin --with-deps"; pnpm exec playwright install chromium; }
      - uses: ./.github/acciones/pila
        with:
          sin: studio,imgproxy,logflare,vector
      - name: .env.local desde supabase status
        run: |
          pnpm exec supabase status -o env > "$RUNNER_TEMP/status.env"
          leer() { grep "^$1=" "$RUNNER_TEMP/status.env" | cut -d= -f2- | tr -d '"'; }
          publica=$(leer PUBLISHABLE_KEY)
          servidor=$(leer SECRET_KEY)
          rm "$RUNNER_TEMP/status.env"
          echo "::add-mask::$servidor"
          if [ "$publica" != "$CLAVE_PUBLICA_LOCAL" ]; then
            echo "::error::La clave publicable de la pila no es CLAVE_PUBLICA_LOCAL: la app compilada no podría hablarle. Actualízala en ci.yml."
            exit 1
          fi
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$SUPABASE_API_LOCAL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$publica"
            echo "SUPABASE_SECRET_KEY=$servidor"
          } > .env.local
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: next-e2e
          path: ${{ runner.temp }}
      - run: tar -xzf "$RUNNER_TEMP/next-e2e.tgz"
      - run: pnpm db:reset
      # Las de e2e/soporte/guardia.ts (FUNCIONES), con su regla: OPTIONS responde y no es 404 ni 5xx. Sin funciones, el paso no hace nada.
      - name: funciones edge (las pide e2e/global-setup.ts)
        run: |
          funciones="apibara storage-gc avatares-miniaturas importar-csv"
          [ -n "$funciones" ] || exit 0
          nohup pnpm exec supabase functions serve > "$RUNNER_TEMP/funciones.log" 2>&1 &
          for _ in $(seq 1 60); do
            faltan=""
            for f in $funciones; do
              s=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS "$SUPABASE_API_LOCAL/functions/v1/$f" || true)
              if [ "$s" = 000 ] || [ "$s" = 404 ] || [ "${s:0:1}" = 5 ]; then faltan="$faltan $f"; fi
            done
            if [ -z "$faltan" ]; then echo "servidas: $funciones"; exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/funciones.log"
          echo "::error::Las funciones edge no respondieron en 120 s:$faltan"
          exit 1
      - name: e2e (${{ needs.cambios.outputs.e2e_modo }}), bloque ${{ matrix.bloque }} de ${{ needs.cambios.outputs.e2e_de }}
        env:
          E2E_PROD: '1'
          E2E_COMPLETO: '1'
          DE: ${{ needs.cambios.outputs.e2e_de || '8' }}
        run: |
          proyecto=(--project=escritorio)
          if [ "$PROYECTOS" = ambos ]; then proyecto=(); fi
          read -ra especs <<< "$ESPECS"
          pnpm exec playwright test --shard=${{ matrix.bloque }}/"$DE" "${proyecto[@]}" "${especs[@]}"
      - name: el log de las funciones y de la base, junto a los artefactos
        if: failure()
        run: |
          mkdir -p e2e-fallos
          cp "$RUNNER_TEMP/funciones.log" e2e-fallos/ 2>/dev/null || true
          bash scripts/ci/volcar-base.sh e2e-fallos
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          # Con el intento en el nombre: al volver a correr lo que cayó, el artefacto del primer intento ya existía y este paso caía
          # con un 409, sin dejar la traza del segundo.
          name: e2e-bloque-${{ matrix.bloque }}-intento-${{ github.run_attempt }}
          path: |
            playwright-report/
            e2e-fallos/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  # Sólo en la plantilla del kit (la salida «plantilla» de `cambios`): genera con scripts/kit/nuevo-proyecto.mjs los dos repos (app y
  # web) de la semilla de ejemplo v2 (scripts/semilla/ejemplo/) y le corre a cada uno lo que corre un proyecto. Así «verde» en el kit
  # significa que lo que sale del kit funciona. El validador de semillas corre con PyYAML exigido (SEMILLA_EXIGE_PYYAML): sin él sus
  # pruebas se saltarían. En un proyecto generado se salta (y para `listo` cuenta como verde).
  ejemplo:
    name: kit · proyecto de ejemplo
    needs: cambios
    if: needs.cambios.outputs.plantilla == 'true'
    runs-on: ubuntu-24.04
    # Dos repos generados, cada uno con su install, lint, tipos y pruebas: el doble que uno.
    timeout-minutes: 45
    env:
      # El generador hace el primer commit de cada repo: en el runner git no tiene autor.
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@ejemplo.test
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@ejemplo.test
      SEMILLA_EXIGE_PYYAML: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/acciones/preparar
      - name: PyYAML para el validador de la semilla
        run: python3 -c 'import yaml' 2>/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q python3-yaml; }
      - run: pnpm test:generador
      - name: el validador de semillas sobre el ejemplo y sus variantes rotas
        run: pnpm exec vitest run scripts/semilla
      - name: generar los repos del ejemplo v2
        run: |
          mkdir -p "$RUNNER_TEMP/proyectos/z_turnero"
          cp -r scripts/semilla/ejemplo/semilla "$RUNNER_TEMP/proyectos/z_turnero/semilla"
          node scripts/kit/nuevo-proyecto.mjs turnero --raiz "$RUNNER_TEMP/proyectos"
      - name: app instala y pasa lint, tipos, pruebas y db:probar
        working-directory: ${{ runner.temp }}/proyectos/z_turnero/app
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm db:probar
      - name: web instala y pasa lint, tipos, pruebas y db:probar
        working-directory: ${{ runner.temp }}/proyectos/z_turnero/web
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm db:probar

  # El aviso de la noche (scripts/flujo/noche.mjs): después del e2e completo de cada noche abre, comenta o cierra el issue `noche-roja`
  # (a la segunda noche seguida en rojo lo vuelve una tarea urgente de la cola: .claude/rules/e2e.md). Es el único job con un permiso
  # de escritura, `issues: write`, y sólo corre con `schedule` (la guarda de scripts/guardas/workflows.ts lo ata a este job y a este
  # `if:`). Sus permisos reemplazan a los del workflow: `contents: read` para el checkout, `actions: read` para los jobs de la corrida.
  # Sin pnpm install: noche.mjs sólo usa node y gh. En la plantilla del kit no hay e2e que avisar y se salta.
  aviso-noche:
    name: Noche · avisar el e2e en rojo
    needs: [cambios, e2e-build, e2e]
    if: always() && github.event_name == 'schedule' && needs.cambios.outputs.plantilla != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Los artefactos de los bloques que cayeron (cada uno con su e2e-fallos/<fecha>/caidos.txt). Sin ninguno, noche.mjs nombra los
      # jobs caídos.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: e2e-bloque-*
          path: ${{ runner.temp }}/fallos
      - name: abrir, comentar o cerrar el issue noche-roja
        env:
          GH_TOKEN: ${{ github.token }}
          NECESIDADES: ${{ toJSON(needs) }}
          FALLOS: ${{ runner.temp }}/fallos
        run: node scripts/flujo/noche.mjs

  # El veredicto del CI en un solo check: verde si ningún job cayó ni se canceló (uno que no tocaba correr cuenta como verde). Es el
  # único que la protección de main exige: los demás cambian de nombre con la matriz o no corren en todo PR, y GitHub no puede esperar
  # a un check que nunca aparece. Con éste en verde el PR se integra solo (docs/FLUJO.md).
  listo:
    name: Listo · todo en verde
    if: always()
    needs:
      - nivel-1
      - pruebas
      - cambios
      - base
      - contrato
      - contrato-uso
      - e2e-build
      - e2e
      - ejemplo
      - aviso-noche
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTADOS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "resultados: $RESULTADOS"
          case " $RESULTADOS " in
            *" failure "* | *" cancelled "*) echo "::error::Algún job cayó o se canceló."; exit 1 ;;
          esac
